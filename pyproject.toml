[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "internasus"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "MCJAM" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "duckdb>=1.5.5",
    "loguru",
    "matplotlib>=3.11.1",
    "mkdocs",
    "numpy>=2.5.2",
    "oci>=2.185.0",
    "pandas>=2.3.3",
    "pip",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pysus>=2.10.5",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "seaborn>=0.13.2",
    "streamlit>=1.62.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "requests-mock>=1.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: chamadas reais às APIs do DataSUS/IBGE (não roda por padrão)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 99
src = ["internasus"]
include = ["pyproject.toml", "internasus/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["internasus"]
force-sort-within-sections = true

